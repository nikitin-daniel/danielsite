<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Daniel Nikitin</title>
<meta name="description" content="Interactive, plain-language breakdowns of Daniel Nikitin's published research — spine surgery outcomes, decision-making, and reward processing.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Daniel Nikitin">
<meta property="og:title" content="Research Breakdown — Daniel Nikitin">
<meta property="og:description" content="Interactive, plain-language breakdowns of Daniel Nikitin's published research.">
<meta property="og:image" content="https://danielnikitin.ca/profile_picture.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT ME — when a paper's data is ready, find its slug in the
     PAPERS object below and replace comingSoon:true with real
     figure/graph markup (Chart.js, SVG, whatever fits the data).
     ============================================================ */
  :root{
    --bg:#0A0B14; --surface:#12131F; --surface-2:#171827;
    --line:rgba(237,234,227,0.09); --line-strong:rgba(237,234,227,0.16);
    --text:#EDEAE3; --text-muted:#8D90A3; --text-faint:#5B5E70;
    --signal:#E8A33D; --synapse:#7C8CFF;
    --display:'Fraunces', serif; --body:'IBM Plex Sans', sans-serif; --mono:'JetBrains Mono', monospace;
    --maxw: 880px;
  }
  *{ box-sizing:border-box; }
  html{ overflow-x: hidden; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--body); line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x: hidden; }
  #brain-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  a{ color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }
  h1,h2,h3{ font-family:var(--display); font-weight:450; margin:0; }

  header{ position:sticky; top:0; z-index:50; backdrop-filter:blur(10px); background:rgba(10,11,20,0.72); border-bottom:1px solid var(--line); }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:18px 32px; max-width:1120px; margin:0 auto; }
  .brand{ font-family:var(--mono); font-size:13px; letter-spacing:0.08em; color:var(--text-muted); text-decoration:none; }
  .brand b{ color:var(--signal); font-weight:500; }
  .back-link{ font-family:var(--mono); font-size:12.5px; letter-spacing:0.08em; color:var(--text-muted); text-decoration:none; display:flex; align-items:center; gap:8px; transition:color .2s ease; }
  .back-link:hover{ color:var(--signal); }

  @media (max-width: 640px){
    .nav-inner{ flex-direction:column; align-items:center; gap:8px; padding:14px 16px; }
    .brand{ font-size:11.5px; }
    .brand-sub{ display:none; }
    .back-link{ font-size:11px; }
  }
  @media (max-width: 860px){
    .wrap{ padding: 0 22px; }
    main{ padding: 80px 0 90px; }
    .placeholder-chart{ padding: 44px 20px; }
  }

  main{ position:relative; z-index:1; padding:100px 0 120px; }

  .status{ font-family:var(--mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--synapse); margin-bottom:22px; display:flex; align-items:center; gap:10px; }
  .status::before{ content:""; width:26px; height:1px; background:var(--synapse); display:inline-block; }
  h1{ font-size:clamp(30px, 4vw, 44px); line-height:1.15; max-width:22ch; }

  .placeholder-chart{
    margin-top:54px; border:1px dashed var(--line-strong); border-radius:16px;
    padding:64px 32px; text-align:center; background:var(--surface);
  }
  .placeholder-chart svg{ width:64px; height:64px; opacity:0.45; margin-bottom:22px; }
  .placeholder-chart h2{ font-size:22px; margin-bottom:10px; }
  .placeholder-chart p{ color:var(--text-muted); font-size:14.5px; max-width:44ch; margin:0 auto; }

  .not-found{ color:var(--text-muted); }
  .not-found a{ color:var(--signal); text-decoration:underline; }

  /* ---------- Paper breakdown ---------- */
  .paper-sub{ color:var(--text-muted); font-size:15.5px; max-width:56ch; margin-top:18px; }
  .viz-section{ margin-top:64px; padding-top:44px; border-top:1px solid var(--line); }
  .viz-section h2{ font-size:24px; margin-bottom:10px; }
  .viz-section .lede{ color:var(--text-muted); font-size:14.5px; max-width:58ch; margin:0 0 30px; }
  .viz-note{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); margin-top:16px; max-width:60ch; }

  /* headline stat */
  .headline-stat{ display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
  .headline-stat .big{ font-family:var(--display); font-size:clamp(52px,8vw,84px); color:var(--signal); line-height:1; }
  .headline-stat .big-label{ font-size:15px; color:var(--text-muted); max-width:26ch; }

  /* pictogram */
  .pictogram-grid{ display:grid; grid-template-columns:repeat(10,1fr); gap:6px; max-width:420px; }
  .pictogram-grid .dot{
    width:100%; aspect-ratio:1/1; border-radius:50%; background:rgba(237,234,227,0.16);
    cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .pictogram-grid .dot.ok{ background:var(--signal); }
  .pictogram-grid .dot.risk{ background:var(--synapse); }
  .pictogram-grid .dot:hover{ transform:scale(1.35); }
  .pictogram-legend{ display:flex; gap:22px; margin-top:18px; flex-wrap:wrap; }
  .pictogram-legend span{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--text-muted); }
  .pictogram-legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  /* stat cards */
  .statcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .statcard{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; cursor:default; transition:border-color .2s ease, background .2s ease; }
  .statcard:hover{ border-color:var(--line-strong); background:var(--surface-2); }
  .statcard .num{ font-family:var(--display); font-size:34px; color:var(--text); }
  .statcard .num span{ color:var(--synapse); }
  .statcard .lbl{ font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-top:6px; }
  .statcard .track{ height:6px; border-radius:999px; background:rgba(237,234,227,0.1); margin-top:14px; overflow:hidden; }
  .statcard .fill{ height:100%; border-radius:999px; background:var(--synapse); }
  .statcard .sub{ font-size:11.5px; color:var(--text-faint); margin-top:10px; font-family:var(--mono); }

  /* study bar chart */
  .studychart{ position:relative; margin-top:8px; --chart-label-w:120px; --chart-val-w:52px; --chart-gap:12px; }
  .studychart-row{ display:grid; grid-template-columns:var(--chart-label-w) 1fr var(--chart-val-w); align-items:center; gap:var(--chart-gap); padding:7px 0; }
  .studychart-name{ font-family:var(--mono); font-size:11.5px; color:var(--text-muted); min-width:0; overflow-wrap:break-word; }
  .studychart-track{ position:relative; height:16px; background:rgba(237,234,227,0.06); border-radius:4px; overflow:visible; }
  .studychart-fill{ height:100%; border-radius:4px; background:var(--synapse); cursor:pointer; transition:background .15s ease, filter .15s ease; }
  .studychart-fill:hover{ background:var(--signal); filter:brightness(1.1); }
  .studychart-val{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); text-align:right; min-width:0; }
  .studychart-avg{ position:absolute; top:-6px; bottom:-6px; width:0; border-left:1px dashed var(--signal); }
  .studychart-avg-label{ position:absolute; top:-20px; font-family:var(--mono); font-size:10px; color:var(--signal); transform:translateX(-50%); white-space:nowrap; }
  .studychart-track-wrap{ position:relative; min-width:0; }

  /* tooltip */
  #viz-tooltip{
    position:fixed; pointer-events:none; z-index:200; background:var(--surface-2); border:1px solid var(--line-strong);
    border-radius:8px; padding:8px 12px; font-family:var(--mono); font-size:11.5px; color:var(--text);
    opacity:0; transition:opacity .12s ease; transform:translate(-50%,-120%); white-space:nowrap;
  }
  #viz-tooltip.show{ opacity:1; }

  .takeaways{ display:flex; flex-direction:column; gap:14px; }
  .takeaway{ display:flex; gap:14px; align-items:flex-start; }
  .takeaway .mark{ font-family:var(--mono); color:var(--signal); font-size:13px; padding-top:2px; }
  .takeaway p{ margin:0; color:var(--text-muted); font-size:14.5px; }
  .takeaway p b{ color:var(--text); font-weight:500; }

  .source-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:20px; text-decoration:none;
    font-family:var(--mono); font-size:12.5px; color:var(--text); padding:10px 16px;
    border:1px solid var(--line-strong); border-radius:999px; transition:border-color .2s ease, background .2s ease;
  }
  .source-link:hover{ border-color:var(--signal); background:rgba(232,163,61,0.08); }

  @media (max-width: 640px){
    .statcards{ grid-template-columns:1fr; }
    .studychart{ --chart-label-w:84px; --chart-val-w:42px; --chart-gap:8px; }
    .pictogram-grid{ max-width:100%; }
    .machine-row{ grid-template-columns:1fr; }
    .theory-cards{ grid-template-columns:1fr; }
    .sim-machines{ grid-template-columns:1fr; }
  }

  /* ---------- Frequency-bias breakdown ---------- */
  .machine-row{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px; }
  .machine-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px;
    cursor:pointer; text-align:center; transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .machine-card:hover{ border-color:var(--line-strong); background:var(--surface-2); transform:translateY(-2px); }
  .machine-card.chosen{ border-color:var(--signal); background:rgba(232,163,61,0.08); }
  .machine-card .m-icon{ font-size:32px; margin-bottom:10px; }
  .machine-card .m-name{ font-family:var(--display); font-size:19px; margin-bottom:8px; }
  .machine-card .m-stat{ font-family:var(--mono); font-size:12.5px; color:var(--text-muted); }
  .machine-card .m-btn{
    margin-top:16px; font-family:var(--mono); font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--signal); border:1px solid var(--line-strong); border-radius:999px; padding:8px 16px; display:inline-block;
  }
  .reveal-box{
    margin-top:22px; background:var(--surface); border:1px solid var(--line-strong); border-radius:14px;
    padding:22px 24px; font-size:14.5px; color:var(--text-muted); display:none;
  }
  .reveal-box.show{ display:block; animation:fadein .3s ease; }
  .reveal-box b{ color:var(--text); }
  @keyframes fadein{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .theory-cards{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px; }
  .theory-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .theory-card h3{ font-size:17px; margin-bottom:10px; }
  .theory-card p{ color:var(--text-muted); font-size:13.5px; margin:0; }
  .verdict{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:#ff8fa3; border:1px solid rgba(255,143,163,0.35); background:rgba(255,143,163,0.08);
    padding:4px 10px; border-radius:999px; margin-bottom:14px;
  }

  .compare-cards{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px; }
  .compare-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; position:relative; }
  .compare-card .c-label{ font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .compare-card .c-num{ font-family:var(--display); font-size:32px; color:var(--text); }
  .compare-card .c-track{ position:relative; height:10px; border-radius:999px; background:rgba(237,234,227,0.08); margin-top:14px; }
  .compare-card .c-fill{ height:100%; border-radius:999px; background:var(--synapse); }
  .compare-card .c-true{ position:absolute; top:-4px; bottom:-4px; width:0; border-left:1px dashed var(--signal); }
  .compare-card .c-true-label{ position:absolute; top:-18px; font-family:var(--mono); font-size:9.5px; color:var(--signal); transform:translateX(-50%); white-space:nowrap; }

  .sim-machines{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:24px; }
  .sim-machine{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .sim-machine .s-name{ font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); }
  .sim-machine .s-record{ font-family:var(--mono); font-size:12px; color:var(--text-faint); margin-top:6px; }
  .sim-machine .s-estimate{ font-family:var(--display); font-size:36px; color:var(--text); margin-top:10px; }
  .sim-machine .s-track{ height:8px; border-radius:999px; background:rgba(237,234,227,0.08); margin-top:12px; overflow:hidden; }
  .sim-machine .s-fill{ height:100%; border-radius:999px; background:var(--synapse); transition:width .4s ease; }
  .sim-machine .s-certainty{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-top:10px; }
  .sim-machine .s-cbar{ height:5px; border-radius:999px; background:rgba(237,234,227,0.08); margin-top:5px; overflow:hidden; }
  .sim-machine .s-cfill{ height:100%; border-radius:999px; background:var(--signal); transition:width .4s ease; }
  .sim-controls{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; align-items:center; }
  .sim-btn{
    font-family:var(--mono); font-size:12px; letter-spacing:0.05em; color:var(--bg); background:var(--signal);
    border:none; border-radius:999px; padding:11px 20px; cursor:pointer; transition:filter .15s ease, transform .15s ease;
  }
  .sim-btn:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .sim-btn.secondary{ background:transparent; color:var(--text-muted); border:1px solid var(--line-strong); }
  .sim-reveal{ font-family:var(--mono); font-size:12px; color:var(--text-faint); }

  footer{ position:relative; z-index:1; padding:40px 0 60px; text-align:center; font-family:var(--mono); font-size:11.5px; color:var(--text-faint); }
</style>
</head>
<body>

<canvas id="brain-canvas"></canvas>

<header>
  <div class="nav-inner">
    <a href="/#home" class="brand">◆ <b>DANIEL NIKITIN</b><span class="brand-sub"> — NEUROSCIENCE</span></a>
    <a href="/#projects" class="back-link">← Back to projects</a>
  </div>
</header>

<main>
  <div class="wrap" id="content"></div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> Daniel Nikitin</div>
</footer>

<script>
/* ============================================================
   EDIT ME — one entry per paper. Add a new object the moment a
   new paper is accepted, matching the slug used in index.html's
   PROJECTS array. Set comingSoon:false and add a `chartHTML`
   string once the figure is ready.
   ============================================================ */
// EDIT ME: keep this in sync with the same constant in index.html
const FREQ_BIAS_LIVE = true;

const PAPERS = {
  "fooled-by-frequency": FREQ_BIAS_LIVE ? {
    status: "Thesis Research · In Preparation",
    title: "Fooled by Frequency—or Enlightened by It?",
    custom: "freqBias"
  } : {
    status: "Thesis Research · In Preparation",
    title: "Fooled by Frequency—or Enlightened by It?",
    comingSoon: false
  },
  "spine-mortality-80": {
    status: "Spine Open · 2026",
    title: "Early Postoperative Mortality and Morbidity Following Elective Spine Surgery in Patients Over 80",
    custom: "spineMortality"
  },
  "thoracolumbar-infection": {
    status: "JAAOS Global Research & Reviews · Accepted",
    title: "Surgical Decision-Making in the Infected Thoracolumbar Spine",
    comingSoon: true
  }
};

document.getElementById('year').textContent = new Date().getFullYear();

const params = new URLSearchParams(window.location.search);
const slug = params.get('paper');
const paper = PAPERS[slug];
const content = document.getElementById('content');

if (paper){
  document.title = `${paper.title} — Daniel Nikitin`;
  const descMeta = document.querySelector('meta[name="description"]');
  if (descMeta) descMeta.setAttribute('content', `${paper.title} — ${paper.status}. An interactive, plain-language breakdown of the research.`);
  const canonical = document.createElement('link');
  canonical.rel = 'canonical';
  canonical.href = `https://danielnikitin.ca/project?paper=${slug}`;
  document.head.appendChild(canonical);
}

if (!paper){
  content.innerHTML = `
    <p class="not-found">Couldn't find that project. <a href="/#projects">Back to projects →</a></p>
  `;
} else if (paper.custom === 'spineMortality'){
  renderSpineMortality();
} else if (paper.custom === 'freqBias'){
  renderFrequencyBias();
} else {
  content.innerHTML = `
    <div class="status">${paper.status}</div>
    <h1>${paper.title}</h1>
    <div class="placeholder-chart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M4 19V5M4 19h16M8 19v-6M12 19V9M16 19v-3"/>
      </svg>
      <h2>Coming soon</h2>
      <p>An interactive breakdown of this paper's data — charted and explained in plain language — is on the way.</p>
    </div>
  `;
}

/* ============================================================
   Custom interactive breakdown: "Early Postoperative Mortality
   and Morbidity Following Elective Spine Surgery in Patients
   Over 80" — pulled from the paper's pooled meta-analysis
   figures (Tables 1, 4 & 5, Figure 2).
   ============================================================ */
/* ============================================================
   Custom interactive breakdown: "Fooled by Frequency—or
   Enlightened by It?" — built from the paper's own arcade-machine
   analogy plus its real Experiment 1 & 2 findings (Figs 2, 3, 5).
   ============================================================ */
function renderFrequencyBias(){
  content.innerHTML = `
    <div class="status">${paper.status}</div>
    <h1>${paper.title}</h1>
    <p class="paper-sub">Ever trust the busier restaurant over the empty one next door, even when you have no idea if the food's actually better? That instinct has a name — and it turns out your brain might be smarter about it than psychologists gave it credit for.</p>

    <div class="viz-section">
      <h2>🎮 You're at the arcade</h2>
      <p class="lede">You watch a friend play two machines before it's your turn. Which one do you pick?</p>
      <div class="machine-row">
        <div class="machine-card" id="machine-a">
          <div class="m-icon">🕹️</div>
          <div class="m-name">Machine A</div>
          <div class="m-stat">Played 10 times · 8 wins</div>
          <div class="m-btn">Play this one</div>
        </div>
        <div class="machine-card" id="machine-b">
          <div class="m-icon">🕹️</div>
          <div class="m-name">Machine B</div>
          <div class="m-stat">Played 5 times · 4 wins</div>
          <div class="m-btn">Play this one</div>
        </div>
      </div>
      <div class="reveal-box" id="arcade-reveal"></div>
    </div>

    <div class="viz-section">
      <h2>Most people pick the busier machine</h2>
      <p class="lede">In real experiments with 173 university students, this exact setup was tested again and again. When one option was shown far more often than the other (70% of the time vs. 30%), a clear pattern emerged — even when both options had <b style="color:var(--text)">identical odds</b>.</p>
      <div class="compare-cards">
        <div class="compare-card">
          <div class="c-label">Seen 70% of the time</div>
          <div class="c-num">~75<span style="font-size:18px">%</span></div>
          <div class="c-track"><div class="c-fill" style="width:75%; background:var(--signal);"></div></div>
        </div>
        <div class="compare-card">
          <div class="c-label">Seen 50% of the time</div>
          <div class="c-num">~50<span style="font-size:18px">%</span></div>
          <div class="c-track"><div class="c-fill" style="width:50%; background:var(--synapse);"></div></div>
        </div>
      </div>
      <p class="viz-note">Approximate share of participants who chose the more-often-seen option, even when both machines paid out at the exact same 80% rate. Sample it more, and it starts to feel like the safer bet — that's the "frequency bias."</p>
    </div>

    <div class="viz-section">
      <h2>So... are we being fooled?</h2>
      <p class="lede">Scientists had two ideas for why this happens. Both got put on trial across two experiments.</p>
      <div class="theory-cards">
        <div class="theory-card">
          <div class="verdict">✕ Not guilty</div>
          <h3>Theory 1: "It looks better than it is"</h3>
          <p>Maybe seeing an option more often makes it <i>seem</i> more rewarding than it really is — an illusion of quality. If true, people would guess win rates <b style="color:var(--text)">higher</b> than reality for the option they'd seen more.</p>
        </div>
        <div class="theory-card">
          <div class="verdict">✕ Not guilty</div>
          <h3>Theory 2: "It just feels more certain"</h3>
          <p>Maybe seeing an option more often just makes people <i>feel</i> more confident in their guess — whether or not the guess is any better. If true, confidence ratings would be higher for the frequently-seen option.</p>
        </div>
      </div>
      <p class="viz-note">Neither panned out. Across 16 different conditions and two full experiments, people never guessed a win rate above the true rate for anything — and their confidence barely budged no matter how often they'd seen an option.</p>
    </div>

    <div class="viz-section">
      <h2>What was actually happening: better guesses</h2>
      <p class="lede">Here's the real finding, using an option with an actual 80% win rate as the example.</p>
      <div class="compare-cards" id="accuracy-chart"></div>
      <p class="viz-note">Hover a bar. Watching an option more often didn't inflate people's guesses past reality — it just let them get <i>closer</i> to it. Seen rarely, people undersold a genuinely good option by nearly 20 points.</p>
    </div>

    <div class="viz-section">
      <h2>🔄 The plot twist</h2>
      <p class="lede">Then the researchers flipped the setup: what if the option you'd seen more often was actually the <i>worse</i> one — a measly 20% win rate?</p>
      <div class="compare-cards" id="reversal-chart"></div>
      <p class="viz-note">The bias flipped right along with it. When the frequently-seen option was genuinely bad, people who'd watched it more were <i>less</i> likely to pick it — not more. That's the opposite of what "fooled by frequency" would predict.</p>
    </div>

    <div class="viz-section">
      <h2>🎲 Try it yourself: watch the pattern emerge</h2>
      <p class="lede">Two machines below secretly have the exact same odds. Every round, Machine A gets watched about 3x more than Machine B — just like the real experiment. Run a few rounds and watch what happens to your confidence in each one.</p>
      <div class="sim-machines">
        <div class="sim-machine">
          <div class="s-name">Machine A · watched often</div>
          <div class="s-record" id="sim-record-a">0 plays · 0 wins</div>
          <div class="s-estimate" id="sim-estimate-a">—</div>
          <div class="s-track"><div class="s-fill" id="sim-fill-a" style="width:0%"></div></div>
          <div class="s-certainty">How sure you can be</div>
          <div class="s-cbar"><div class="s-cfill" id="sim-cert-a" style="width:0%"></div></div>
        </div>
        <div class="sim-machine">
          <div class="s-name">Machine B · watched rarely</div>
          <div class="s-record" id="sim-record-b">0 plays · 0 wins</div>
          <div class="s-estimate" id="sim-estimate-b">—</div>
          <div class="s-track"><div class="s-fill" id="sim-fill-b" style="width:0%"></div></div>
          <div class="s-certainty">How sure you can be</div>
          <div class="s-cbar"><div class="s-cfill" id="sim-cert-b" style="width:0%"></div></div>
        </div>
      </div>
      <div class="sim-controls">
        <button class="sim-btn" id="sim-run">Watch 10 more rounds</button>
        <button class="sim-btn secondary" id="sim-reset-btn">Reset</button>
        <span class="sim-reveal" id="sim-reveal-text"></span>
      </div>
    </div>

    <div class="viz-section">
      <h2>So what's actually going on?</h2>
      <div class="takeaways">
        <div class="takeaway"><span class="mark">→</span><p><b>It's not a glitch — it's a shortcut.</b> The "frequency bias" isn't your brain being fooled. It's your brain correctly noticing it has more evidence about one option than the other.</p></div>
        <div class="takeaway"><span class="mark">→</span><p><b>More sampling → better guesses, not bigger ones.</b> People's estimates got closer to the truth with more exposure — they never overshot it.</p></div>
        <div class="takeaway"><span class="mark">→</span><p><b>This is why the familiar feels safe.</b> The restaurant you've been to ten times, the brand you've bought before, the doctor you've seen for years — you're not just comfortable, you genuinely have better data.</p></div>
        <div class="takeaway"><span class="mark">→</span><p><b>But it only works if you've actually sampled enough.</b> Trusting something after one good experience isn't the same as trusting it after ten.</p></div>
      </div>
      <a class="source-link" href="https://osf.io/fe3jg" target="_blank" rel="noopener">
        View materials & data on OSF →
      </a>
    </div>
  `;

  setupArcadeDemo();
  buildAccuracyChart();
  buildReversalChart();
  setupSimulator();
}

function setupArcadeDemo(){
  const reveal = document.getElementById('arcade-reveal');
  const text = `Both machines actually have the <b>exact same 80% win rate</b> — Machine A just got played twice as often. In the real study, when one option was sampled about 70% of the time, participants picked it roughly 75% of the time, even though the odds were identical. When both were sampled equally, choices split close to 50/50.`;
  ['machine-a','machine-b'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.getElementById('machine-a').classList.toggle('chosen', id === 'machine-a');
      document.getElementById('machine-b').classList.toggle('chosen', id === 'machine-b');
      const picked = id === 'machine-a' ? 'Machine A — the one you saw more often' : 'Machine B — the one you saw less often';
      reveal.innerHTML = `<b>You picked ${picked}.</b> ${text}`;
      reveal.classList.add('show');
    });
  });
}

function buildAccuracyChart(){

function buildReversalChart(){

function setupSimulator(){
  const TRUE_RATE = 0.65; // hidden true win rate, identical for both machines
  let a = { plays:0, wins:0 };
  let b = { plays:0, wins:0 };

  function flip(){ return Math.random() < TRUE_RATE ? 1 : 0; }

  function certainty(plays){
    // playful, illustrative "confidence" curve — not a real statistical CI
    return Math.min(100, Math.round(100 * (1 - 1/Math.sqrt(plays + 1))));
  }

  function render(){
    const estA = a.plays ? Math.round(100 * a.wins / a.plays) : null;
    const estB = b.plays ? Math.round(100 * b.wins / b.plays) : null;
    document.getElementById('sim-record-a').textContent = `${a.plays} plays · ${a.wins} wins`;
    document.getElementById('sim-record-b').textContent = `${b.plays} plays · ${b.wins} wins`;
    document.getElementById('sim-estimate-a').textContent = estA === null ? '—' : estA + '%';
    document.getElementById('sim-estimate-b').textContent = estB === null ? '—' : estB + '%';
    document.getElementById('sim-fill-a').style.width = (estA || 0) + '%';
    document.getElementById('sim-fill-b').style.width = (estB || 0) + '%';
    document.getElementById('sim-cert-a').style.width = certainty(a.plays) + '%';
    document.getElementById('sim-cert-b').style.width = certainty(b.plays) + '%';

    const revealEl = document.getElementById('sim-reveal-text');
    if (a.plays >= 60){
      revealEl.textContent = `Psst — both machines are actually set to the same ${Math.round(TRUE_RATE*100)}% win rate. Notice how much more confident you are about Machine A?`;
    } else if (a.plays > 0){
      revealEl.textContent = `${a.plays + b.plays} rounds watched so far — keep going to see your confidence gap grow.`;
    } else {
      revealEl.textContent = '';
    }
  }

  document.getElementById('sim-run').addEventListener('click', () => {
    for (let i = 0; i < 7; i++){ a.plays++; a.wins += flip(); }
    for (let i = 0; i < 3; i++){ b.plays++; b.wins += flip(); }
    render();
  });
  document.getElementById('sim-reset-btn').addEventListener('click', () => {
    a = { plays:0, wins:0 }; b = { plays:0, wins:0 };
    render();
  });
  render();
}

function buildPictogram(){
  const el = document.getElementById('pictogram');
  let html = '';
  for (let i = 1; i <= 100; i++){
    const risk = i <= 2; // ~2 in 100 did not survive 30 days
    html += `<div class="dot ${risk ? 'risk' : 'ok'}" data-tip="${risk ? 'Did not survive 30 days' : 'Survived 30 days'}"></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('mouseenter', e => showTip(e, dot.dataset.tip));
    dot.addEventListener('mousemove', moveTip);
    dot.addEventListener('mouseleave', hideTip);
  });
}

function buildBarChart(containerId, data, avgValue, unit){
  const el = document.getElementById(containerId);
  const max = Math.max(...data.map(d => d.value), avgValue) * 1.08;
  const frac = avgValue / max;
  const avgLeft = `calc(var(--chart-label-w) + var(--chart-gap) + (100% - var(--chart-label-w) - var(--chart-val-w) - (2 * var(--chart-gap))) * ${frac})`;
  let rows = data.map(d => {
    const pct = (d.value / max) * 100;
    return `
      <div class="studychart-row">
        <div class="studychart-name">${d.name}</div>
        <div class="studychart-track-wrap">
          <div class="studychart-track">
            <div class="studychart-fill" style="width:${pct}%" data-tip="${d.name}: ${d.value}${unit}"></div>
          </div>
        </div>
        <div class="studychart-val">${d.value}${unit}</div>
      </div>
    `;
  }).join('');
  el.innerHTML = `
    <div style="position:relative;">
      <div class="studychart-avg" style="left:${avgLeft}">
        <div class="studychart-avg-label">avg</div>
      </div>
      ${rows}
    </div>
  `;
  el.querySelectorAll('.studychart-fill').forEach(bar => {
    bar.addEventListener('mouseenter', e => showTip(e, bar.dataset.tip));
    bar.addEventListener('mousemove', moveTip);
    bar.addEventListener('mouseleave', hideTip);
  });
}

function setupStatcardTooltips(){
  document.querySelectorAll('.statcard[data-tip]').forEach(card => {
    card.addEventListener('mouseenter', e => showTip(e, card.dataset.tip));
    card.addEventListener('mousemove', moveTip);

/* ---------- Shared tooltip ---------- */
const tipEl = document.createElement('div');
tipEl.id = 'viz-tooltip';
document.body.appendChild(tipEl);
function showTip(e, text){ tipEl.textContent = text; tipEl.classList.add('show'); moveTip(e); }
function moveTip(e){ tipEl.style.left = e.clientX + 'px'; tipEl.style.top = e.clientY + 'px'; }
function hideTip(){ tipEl.classList.remove('show'); }


/* ---------- Ambient brain canvas (lighter, no anchored cluster) ---------- */
(function(){
  const canvas = document.getElementById('brain-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, nodes = [];
  let mouse = { x:-9999, y:-9999, active:false };

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const count = W < 700 ? 26 : 50;
    nodes = [];
    for(let i=0;i<count;i++){
      const x = Math.random()*W, y = Math.random()*H;
      nodes.push({ baseX:x, baseY:y, x, y, r:1+Math.random()*1.1, phase: Math.random()*Math.PI*2 });
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; });
  window.addEventListener('mouseleave', () => { mouse.active=false; });

  let t = 0;
  function tick(){
    t += reduceMotion ? 0.002 : 0.006;
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n => {
      let tx = n.baseX + Math.sin(t*1.2+n.phase)*10;
      let ty = n.baseY + Math.cos(t*1.0+n.phase)*10;
      if (mouse.active && !reduceMotion){
        const dx=tx-mouse.x, dy=ty-mouse.y, dist=Math.sqrt(dx*dx+dy*dy), range=130;
        if (dist<range){ const f=(1-dist/range)*22; tx += (dx/(dist||1))*f; ty += (dy/(dist||1))*f; }
      }
      n.x += (tx-n.x)*0.06; n.y += (ty-n.y)*0.06;
    });
    const maxDist = 130;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        const dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy);
        if (dist<maxDist){
          const nearMouse = mouse.active && (Math.hypot(a.x-mouse.x,a.y-mouse.y)<140 || Math.hypot(b.x-mouse.x,b.y-mouse.y)<140);
          const alpha = (1-dist/maxDist)*0.22;
          ctx.strokeStyle = nearMouse ? `rgba(232,163,61,${Math.min(alpha*2.5,0.8)})` : `rgba(124,140,255,${alpha})`;
          ctx.lineWidth = nearMouse ? 1 : 0.6;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    nodes.forEach(n => {
      const nearMouse = mouse.active && Math.hypot(n.x-mouse.x,n.y-mouse.y)<140;
      ctx.beginPath();
      ctx.arc(n.x, n.y, nearMouse? n.r*2.2 : n.r, 0, Math.PI*2);
      ctx.fillStyle = nearMouse ? '#E8A33D' : 'rgba(237,234,227,0.3)';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  resize();
  requestAnimationFrame(tick);
})();
</script>
